<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </radialGradient>
    <!-- Neon Star Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Glowing Cyberpunk Star -->
  <path d="M256 60 L310 190 L450 200 L340 290 L380 430 L256 350 L132 430 L172 290 L62 200 L202 190 Z" 
        fill="none" 
        stroke="#F5A623" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>
  <!-- Inner Glow Accent -->
  <path d="M256 100 L298 200 L406 208 L322 277 L352 385 L256 323 L160 385 L190 277 L106 208 L214 200 Z" 
        fill="#00E5FF" 
        opacity="0.8"
        filter="url(#neonGlow)"/>
</svg>
